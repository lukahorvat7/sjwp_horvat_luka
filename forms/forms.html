<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forms</title>
</head>
<body>
  <h1>HTML forme</h1>
  <form action="#" method="get">
  <label for="name">unesi ime</label>
  <input type="text" id="name" placeholder="unesi ime..." size="15" maxlength="5" value="ivan" required> <br>
  <label for="pass">unesi lozinku:</label>
<input type="password" name="pass" id="pass">
<br>
<label for="mail">unesite e-mail</label>
<input type="email" name="mail" id="mail">

<label for="datum">odaberi datum</label>
<input type="date" name="datum" id="datum"> <br>
<label for="boja">izabeti boju</label> 
<input type="color" name="boja" id="boja">
<br>
<label for="file">izaberi file:</label>
<input type="file" name="file" id="file"> <br>
<label for="telefon" pattern="[0-9]" title="unesi samo brojeve">unesi broj telefona</label>
<input type="tel" name="telefon" id="telefon"><br>
<input type="submit" value="pošalji"><br>
<p>odaberi najbolji klub:</p><br>
<input type="radio" name="klub" id="real">
<label for="real">real madrid</label><br>
<input type="radio" name="klub" id="barca">
<label for="barca">barcelona</label><br>
<input type="radio" name="klub" id="marsa">
<label for="marsa">marsonija</label><br>
<p>odabei najbolji klub</p>
<input type="checkbox" name="klub1" id="real">
<label for="real">real madrid</label> <br>
<input type="checkbox" name="klub2" id="barca">
<label for="barca">barcelona</label><br>
<input type="checkbox" name="klub3" id="marsa">
<label for="marsa">marsonija</label><br>
<input type="reset" value="obriši sve">
  </form>
  
</body>
</html>
